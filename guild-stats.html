<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Guild Stats — Cloudy Bay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#0f141c;--card:#161d28;--line:#2a3442;--txt:#e6e9ef;--dim:#9aa4b2;
    --accent:#e11d33;--good:#37b24d;--bad:#e0524a;--warn:#f0a020;--raid:#7a3cc0;--tb:#0f8a99;--bar:#2b6cb0}
  *{box-sizing:border-box}
  body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.5;
    margin:0 auto;max-width:1000px;padding:20px 14px 60px;color:var(--txt);background:var(--bg)}
  a.homelink{color:var(--dim);text-decoration:none;font-size:13px}
  a.homelink:hover{color:var(--txt)}
  h1{font-size:24px;margin:12px 0 2px}
  .sub{color:var(--dim);margin:0 0 14px;font-size:13px}
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:0 0 16px}
  .tabs button{background:transparent;border:0;color:var(--dim);padding:9px 14px;cursor:pointer;
    font:inherit;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button.on{color:var(--txt);border-bottom-color:var(--accent)}
  .pane{display:none} .pane.on{display:block}
  .tblwrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--dim);font-weight:600;cursor:pointer;user-select:none}
  th.act::after{content:" \25BE";color:var(--accent)} th.asc::after{content:" \25B4";color:var(--accent)}
  tr.mem{cursor:pointer} tr.mem:hover td{background:var(--card)}
  td.num{font-variant-numeric:tabular-nums}
  .tickbar{display:inline-block;width:60px;height:7px;border-radius:4px;background:#0c1017;
    border:1px solid var(--line);overflow:hidden;vertical-align:middle;margin-left:6px}
  .tickbar i{display:block;height:100%;background:var(--bar)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .dot.ok{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
  .seen.warn{color:var(--warn)} .seen.bad{color:var(--bad);font-weight:600}
  .ally{color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums;margin-left:6px;display:none}
  body.show-ally .ally{display:inline}
  .allytoggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);
    margin:0 0 14px;cursor:pointer;user-select:none}
  .win{color:var(--good);font-weight:600} .loss{color:var(--bad);font-weight:600}
  .detail td{background:#0c1017;text-align:left;padding:10px 14px}
  .chart svg{max-width:100%;height:auto}
  .muted{color:var(--dim);font-size:12px;margin:4px 0}
  .summary{margin:0 0 16px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:8px}
  .summary .tot{font-size:13px;color:var(--dim)}
  .summary .tot b{color:var(--txt);font-size:17px;font-variant-numeric:tabular-nums;margin:0 2px}
  footer{margin-top:30px;color:#5c6674;font-size:12px}
  @media (prefers-color-scheme: light){:root{--bg:#eef1f5;--card:#fff;--line:#d3dae4;--txt:#18202c;--dim:#5a6576} .detail td{background:#f4f6f9}}
</style>
</head>
<body>
  <a class="homelink" href="index.html">← Cloudy Bay reports</a>
  <h1>Guild Stats</h1>
  <p class="sub" id="sub"></p>
  <div class="tabs">
    <button data-tab="raids" class="on">Raids</button>
    <button data-tab="tb">Territory Battle</button>
    <button data-tab="tw">Territory War</button>
    <button data-tab="tickets">Raid Tickets</button>
  </div>
  <label class="allytoggle"><input type="checkbox" id="ally-tog"> Show ally codes</label>
  <div class="pane on" id="pane-raids"><div class="summary" id="raids-sum"></div><div class="tblwrap"><table id="t-raids"></table></div></div>
  <div class="pane" id="pane-tb"><div class="summary" id="tb-sum"></div><div class="tblwrap"><table id="t-tb"></table></div></div>
  <div class="pane" id="pane-tw"><div class="chart" id="tw-chart"></div><div class="tblwrap"><table id="t-tw"></table></div></div>
  <div class="pane" id="pane-tickets"><div class="summary" id="tk-sum"></div><p class="muted" id="tk-note"></p><div class="tblwrap"><table id="t-tk"></table></div></div>
  <footer id="foot"></footer>

<script>
(async function(){
// Data lives in a separate file fetched with no-store + a unique query, so a refresh always shows the
// latest numbers immediately — never a browser- or CDN-cached snapshot.
let DATA;
try {
  const resp = await fetch('guild-stats-data.json?_=' + Date.now(), {cache:'no-store'});
  DATA = await resp.json();
} catch (e) {
  document.getElementById('sub').textContent = 'Could not load data — check your connection and refresh.';
  return;
}
const fmt = n => (n==null?"—":Number(n).toLocaleString());
// Compact value for in-chart labels so they stay short at 10 points (e.g. 12.3M, 450k).
const cfmt = n => { n=Number(n)||0; const a=Math.abs(n);
  if(a>=1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'')+'M';
  if(a>=1e3) return Math.round(n/1e3)+'k';
  return String(Math.round(n)); };
const esc = s => String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
// 9-digit ally code as 123-456-789. Rendered hidden by default; the toggle reveals it (some
// members share a display name, so the code is how you tell them apart).
const acode = n => { const s=String(n); return s.length===9?`${s.slice(0,3)}-${s.slice(3,6)}-${s.slice(6)}`:s; };
const nm = m => `${esc(m.name)}${m.ally?`<span class="ally">#${acode(m.ally)}</span>`:""}`;
const dstr = ms => new Date(ms).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const NOW = Date.now();
function seen(ms){
  if(!ms) return {cls:"",dot:"ok",txt:"—"};
  const h=(NOW-ms)/3600000, cls=h>72?"bad":h>36?"warn":"", dot=h>72?"bad":h>36?"warn":"ok";
  const txt=h<24?Math.round(h)+"h":Math.floor(h/24)+"d "+Math.round(h%24)+"h";
  return {cls,dot,txt};
}

document.getElementById('sub').textContent = `${DATA.guild} · ${DATA.members.length} members · snapshot ${DATA.generatedAt}`;
document.getElementById('foot').textContent =
  `Raids: ${DATA.raidCount} · TBs: ${DATA.tbCount} · TWs: ${DATA.twCount}. `+
  `TB "Deploy ÷ GP" ≈ phases deployed (≈6 = all six). Raid/TB history grows as the report re-runs; TW is guild-level (no per-member data).`;

function chartBlock(hist,label,stroke,dot,unit){
  let h=(hist||[]).slice().sort((a,b)=>a.t-b.t);
  if(h.length===0) return `<div class="muted">No ${unit} data yet.</div>`;
  const total=h.length;
  h=h.slice(-10);                                   // cap to the last 10
  if(h.length===1) return `<div class="muted"><b>${label}</b>: ${fmt(h[0].score)} (1 ${unit} so far — history builds as the report re-runs).</div>`;
  const W=Math.min(760,80+h.length*72),H=160,pad=30,padTop=34;
  const xs=h.map((_,i)=>pad+i*((W-2*pad)/(h.length-1)));
  const max=Math.max(...h.map(p=>p.score)),min=Math.min(...h.map(p=>p.score));
  const y=v=>H-pad-(max===min?(H-pad-padTop)/2:(v-min)/(max-min)*(H-pad-padTop));
  const pts=h.map((p,i)=>`${xs[i]},${y(p.score)}`).join(" ");
  const dots=h.map((p,i)=>`<circle cx="${xs[i]}" cy="${y(p.score)}" r="3" fill="${dot}"><title>${fmt(p.score)}</title></circle>`).join("");
  const vals=h.map((p,i)=>`<text x="${xs[i]}" y="${y(p.score)-8}" font-size="9" text-anchor="middle" style="fill:var(--txt);font-variant-numeric:tabular-nums">${cfmt(p.score)}</text>`).join("");
  const lbl=h.map((p,i)=>`<text x="${xs[i]}" y="${H-8}" font-size="9" fill="#9aa4b2" text-anchor="middle">${dstr(p.t)}</text>`).join("");
  const cap=total>h.length?` (last ${h.length} of ${total})`:` — ${h.length} ${unit}`;
  return `<div style="margin-top:6px"><b>${label}</b>${cap} (max ${fmt(max)})</div>
    <svg viewBox="0 0 ${W} ${H}" width="${W}"><polyline points="${pts}" fill="none" stroke="${stroke}" stroke-width="2"/>${dots}${vals}${lbl}</svg>`;
}

function memberTable(tableId, cols, chartCfg){
  let key=cols.find(c=>c.def)?.k||cols[0].k, asc=false;
  const tbl=document.getElementById(tableId);
  function draw(){
    const rows=[...DATA.members].filter(m=>m[chartCfg.metric]!=null || key==='name').sort((a,b)=>{
      let x=a[key],y=b[key];
      if(typeof x==="string"||typeof y==="string"){x=String(x||"");y=String(y||"");return asc?x.localeCompare(y):y.localeCompare(x);}
      x=x??-1;y=y??-1;return asc?x-y:y-x;
    });
    tbl.innerHTML=`<thead><tr>${cols.map(c=>`<th data-k="${c.k}" class="${c.k===key?(asc?'asc':'act'):''}">${c.label}</th>`).join("")}</tr></thead>`+
      `<tbody>${rows.map(m=>`<tr class="mem" data-id="${m.id}">${cols.map(c=>`<td class="${c.cls||'num'}">${c.render(m)}</td>`).join("")}</tr>`).join("")}</tbody>`;
    tbl.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(k===key)asc=!asc;else{key=k;asc=false;}draw();});
    tbl.querySelectorAll('tr.mem').forEach(tr=>tr.onclick=()=>{
      const nx=tr.nextElementSibling; if(nx&&nx.classList.contains('detail')){nx.remove();return;}
      tbl.querySelectorAll('tr.detail').forEach(e=>e.remove());
      const m=DATA.members.find(x=>x.id===tr.dataset.id);
      const d=document.createElement('tr');d.className='detail';
      d.innerHTML=`<td colspan="${cols.length}" class="chart">${chartBlock(m[chartCfg.hist],esc(m.name)+" — "+chartCfg.label,chartCfg.stroke,chartCfg.dot,chartCfg.unit)}${chartCfg.extra?chartCfg.extra(m):""}</td>`;
      tr.after(d);
    });
  }
  draw();
}

memberTable('t-raids',[
  {k:'name',label:'Member',cls:'l',render:m=>nm(m)},
  {k:'lastRaidScore',label:'Last raid score',def:true,render:m=>fmt(m.lastRaidScore)},
],{hist:'history',metric:'lastRaidScore',label:'raid score',stroke:'var(--raid)',dot:'#b478f0',unit:'raids'});

// deployRatio is precomputed + frozen at each TB's capture time (deploy GP ÷ member GP then),
// so it doesn't skew as rosters grow. ≈ how many of the 6 TB phases a member deployed in.
memberTable('t-tb',[
  {k:'name',label:'Member',cls:'l',render:m=>nm(m)},
  {k:'tbBanners',label:'Last TB banners',def:true,render:m=>fmt(m.tbBanners)},
  {k:'tbDeploy',label:'GP deployed',render:m=>fmt(m.tbDeploy)},
  {k:'deployRatio',label:'Deploy ÷ GP',render:m=> m.deployRatio!=null? m.deployRatio.toFixed(1)+'×' : '—'},
],{hist:'tbHistory',metric:'tbBanners',label:'TB banners',stroke:'var(--tb)',dot:'#2bb6c4',unit:'TBs'});

(function(){
  const tw=[...(DATA.tw||[])].sort((a,b)=>b.t-a.t);
  const chartData=[...tw].reverse().map(w=>({t:w.t,score:w.score}));
  document.getElementById('tw-chart').innerHTML=chartData.length?chartBlock(chartData,DATA.guild+" — TW score",'var(--accent)','#e11d33','wars'):"";
  const wins=tw.filter(w=>w.win).length;
  document.getElementById('t-tw').innerHTML=
    `<thead><tr><th class="l">War ended</th><th>Our score</th><th>Opponent</th><th>Result</th><th>Guild power</th></tr></thead>`+
    `<tbody>${tw.map(w=>`<tr><td class="l">${dstr(w.t)}</td><td class="num">${fmt(w.score)}</td><td class="num">${fmt(w.opp)}</td>
      <td class="num ${w.win?'win':'loss'}">${w.win?'WIN':'LOSS'}</td><td class="num">${fmt(w.power)}</td></tr>`).join("")}</tbody>`;
  if(tw.length){const c=document.createElement('p');c.className='muted';c.textContent=`Record: ${wins}W – ${tw.length-wins}L over ${tw.length} wars.`;document.getElementById('pane-tw').insertBefore(c,document.getElementById('tw-chart'));}
})();

// Raid tickets — 10-day moving average + last completed day + today's live progress. Runs on the
// same engine as the raid/TB tables: every header sorts (default highest-average first, as an
// improvement leaderboard) and clicking a member expands their last-10-days ticket chart.
memberTable('t-tk',[
  {k:'name',label:'Member',cls:'l',render:m=>nm(m)},
  {k:'avgTickets',label:'Avg / day (10-day)',def:true,render:m=>m.avgTickets==null?"—":Number(m.avgTickets).toFixed(2)},
  {k:'lastDay',label:'Last day',render:m=>fmt(m.lastDay)},
  {k:'ticketsToday',label:'Today',render:m=>`${fmt(m.ticketsToday)}<span class="tickbar"><i style="width:${Math.min(100,(m.ticketsToday||0)/600*100)}%"></i></span>`},
  {k:'lastActive',label:'Last seen',cls:'',render:m=>{const s=seen(m.lastActive);return `<span class="num seen ${s.cls}"><span class="dot ${s.dot}"></span>${s.txt}</span>`;}},
],{hist:'ticketHist',metric:'ticketsToday',label:'daily tickets',stroke:'var(--bar)',dot:'#4f9bd9',unit:'days'});
document.getElementById('tk-note').textContent=
  'Daily raid tickets from each member’s lifetime total minus today’s counter (cap 600) — so tickets done right before the reset are counted on the correct day. '+
  'Averaged over the trailing 10 completed days. "Last day" is the most recent completed day; "Today" is live and resets at the daily guild reset. '+
  'Each completed day is exact and appears the next day; until 10 real days build up, the average is seeded from each member’s lifetime daily rate and real days replace it. '+
  'Click any header to sort, or a member for their last 10 days. Last seen: 🟡 >36h · 🔴 >72h since last activity.';

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='pane-'+b.dataset.tab));
});

// Ally-code reveal (default off) — flips a body class; codes are pre-rendered but CSS-hidden.
document.getElementById('ally-tog').onchange=e=>document.body.classList.toggle('show-ally',e.target.checked);

// Per-tab guild-wide summary: a headline total + its own trend chart (reuses chartBlock).
function totalPanel(elId, headlineHtml, hist, label, stroke, dot, unit){
  const el=document.getElementById(elId); if(!el) return;
  el.innerHTML=`<div class="tot">${headlineHtml}</div>`+chartBlock(hist||[],label,stroke,dot,unit);
}
totalPanel('raids-sum',
  `Guild total — latest raid: <b>${fmt(DATA.guildRaidTotal)}</b>`,
  DATA.raidTotals, 'Guild raid total', 'var(--raid)', '#b478f0', 'raids');
totalPanel('tb-sum',
  `Territory Battle stars — latest: <b>${fmt(DATA.tbStarsNow)}</b>`,
  DATA.tbStarHist, 'Guild TB stars', 'var(--tb)', '#2bb6c4', 'TBs');
totalPanel('tk-sum',
  `Guild raid tickets — today: <b>${fmt(DATA.guildTicketsToday)}</b> · last full day: <b>${fmt(DATA.guildTicketsLastDay)}</b>`,
  DATA.ticketTotals, 'Guild daily tickets', 'var(--bar)', '#4f9bd9', 'days');
})();
</script>
</body>
</html>
