<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Players Data — Cloudy Bay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#0f141c;--card:#161d28;--line:#2a3442;--txt:#e6e9ef;--dim:#9aa4b2;
    --accent:#e11d33;--bar:#2b6cb0}
  *{box-sizing:border-box}
  body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.55;
    max-width:860px;margin:0 auto;padding:20px 16px 60px;color:var(--txt);background:var(--bg)}
  a.homelink{color:var(--dim);text-decoration:none;font-size:13px}
  a.homelink:hover{color:var(--txt)}
  h1{font-size:26px;margin:14px 0 2px}
  .sub{color:var(--dim);margin:0 0 18px;font-size:14px}
  input{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--txt);width:100%;max-width:320px;margin:0 0 14px}
  .msg{padding:12px 14px;border-radius:8px;margin:14px 0;font-size:14px;background:var(--card);border:1px solid var(--line)}
  .msg.err{background:#3a1113;border-color:#63232a;color:#f3b5bb}
  /* directory */
  ul.dir{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
  ul.dir a{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:11px 14px;border:1px solid var(--line);border-radius:9px;background:var(--card);
    color:var(--txt);text-decoration:none}
  ul.dir a:hover{border-color:var(--accent)}
  ul.dir .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  ul.dir .gp{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
  /* snapshot */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .card .k{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
  .card .v{font-size:21px;font-weight:600;margin-top:2px}
  section{margin:24px 0}
  h2{font-size:16px;margin:0 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
  .dist{display:grid;grid-template-columns:40px 1fr 42px;gap:6px 10px;align-items:center;font-size:13px}
  .dist .lbl{color:var(--dim);text-align:right}
  .track{background:#0c1017;border:1px solid var(--line);border-radius:5px;height:16px;overflow:hidden}
  .fill{height:100%;background:var(--bar)}
  .fill.relic{background:linear-gradient(90deg,#7a3cc0,#b478f0)}
  .cnt{text-align:right;font-variant-numeric:tabular-nums}
  .tblwrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--dim);font-weight:600}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .r{color:#b478f0;font-weight:600}
  .back{display:inline-block;margin:0 0 8px;color:var(--dim);text-decoration:none;font-size:13px}
  .back:hover{color:var(--txt)}
  .journeylink{display:inline-block;padding:8px 14px;border:1px solid var(--accent);border-radius:8px;
    color:var(--txt);text-decoration:none;font-size:14px;background:rgba(225,29,51,.08)}
  .journeylink:hover{background:var(--accent);color:#fff}
  /* gear planner */
  .pcontrols{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
  .pcontrols select,.pcontrols input{font:inherit;padding:9px 12px;border:1px solid var(--line);
    border-radius:8px;background:var(--card);color:var(--txt);margin:0}
  .pcontrols input{flex:1;min-width:160px;max-width:none}
  #gunits{display:flex;flex-direction:column;gap:5px}
  .urow{border:1px solid var(--line);border-radius:9px;background:var(--card);overflow:hidden}
  .uhead{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;
    padding:9px 13px;cursor:pointer}
  .uhead:hover{background:rgba(127,140,160,.06)}
  .uhead .un{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .uhead .uc{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .uhead .us{font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:70px;text-align:right}
  .uhead .us .done{color:#37b24d}
  .udet:empty{display:none}
  .udet{padding:4px 13px 12px}
  .gtier{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:start;padding:5px 0;border-top:1px solid var(--line)}
  .gtier .glbl{font-size:12px;color:var(--dim);font-weight:600;padding-top:3px}
  .chips{display:flex;flex-wrap:wrap;gap:4px}
  .chip{font-size:11.5px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:#0c1017}
  .chip.relic{border-color:#5a3c80;background:rgba(176,107,224,.12)}
  @media (prefers-color-scheme: light){.chip{background:#eef1f5} .chip.relic{background:rgba(138,63,191,.1)}}
  /* multi-select cart planner */
  .seg2{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg2 button{font:inherit;padding:8px 12px;background:var(--card);color:var(--dim);border:0;cursor:pointer}
  .seg2 button.on{background:var(--accent);color:#fff}
  .invtog{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--dim);cursor:pointer}
  .invtog input{width:auto;margin:0}
  .crow{display:grid;grid-template-columns:auto 1fr auto minmax(0,150px) auto;gap:10px;align-items:center;
    padding:9px 13px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
  .crow.on{border-color:var(--accent)}
  .crow .cb{width:auto;margin:0;cursor:pointer}
  .crow .cn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crow .cc{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .crow .ctgt{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--txt);margin:0;width:100%}
  .crow .cneed{font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;cursor:pointer;min-width:64px}
  .crow .cneed .done{color:#37b24d}
  .cdet:empty{display:none}
  .cdet{padding:2px 13px 10px}
  .ptotal:empty{display:none}
  .ptotal{margin-top:16px;border:1px solid var(--accent);border-radius:11px;background:rgba(225,29,51,.06);padding:12px 14px}
  .ptotal .ttitle{font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
  .ptotal .tsum{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;font-weight:400}
  /* mods */
  .mrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:0 0 14px}
  .mkpi{font-size:13px;color:var(--dim)} .mkpi b{color:var(--txt);font-variant-numeric:tabular-nums}
  .mtag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:20px;border:1px solid var(--line)}
  .mtag.work{color:#e0b53d;border-color:#6b571d;background:rgba(224,181,61,.1)}
  .mtag.del{color:#f3868f;border-color:#63232a;background:rgba(225,29,51,.09)}
  .mtag.done{color:#5bc46f;border-color:#2c5233;background:rgba(76,175,80,.1)}
  .munit{border:1px solid var(--line);border-radius:9px;background:var(--card);padding:9px 12px;margin:0 0 7px}
  .mhead{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;margin-bottom:8px}
  .mhead .mn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mhead .mmeta{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .mhead .mcnt{font-size:12px;white-space:nowrap}
  .mgrid,.mpool{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .mpool{margin:6px 0 4px}
  .mcard{position:relative;border:1px solid var(--line);border-top-width:3px;border-radius:9px;
    background:#0c1017;padding:8px 10px;font-size:12px}
  @media (prefers-color-scheme: light){.mcard{background:#f3f5f8}}
  .mcard.mc1{border-color:#8a94a3} .mcard.mc2{border-color:#4caf50} .mcard.mc3{border-color:#3d7bd6}
  .mcard.mc4{border-color:#a259e6} .mcard.mc5{border-color:#e0b53d}
  .mcard.mc2{background:rgba(76,175,80,.06)} .mcard.mc3{background:rgba(61,123,214,.07)}
  .mcard.mc4{background:rgba(162,89,230,.08)} .mcard.mc5{background:rgba(224,181,61,.08)}
  .mcard.clash{box-shadow:inset 0 0 0 1px #e11d33}
  .mcHead{display:flex;align-items:center;gap:6px;margin-bottom:5px}
  .mcHead .msym{font-size:15px;line-height:1} .mcHead .mcSet{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mcHead .mcBadge{font-size:11px}
  .mcSub{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--dim);
    font-variant-numeric:tabular-nums;margin-bottom:5px;flex-wrap:wrap}
  .calAv{color:#e0b53d;border:1px solid #6b571d;background:rgba(224,181,61,.12);
    border-radius:10px;padding:0 6px;font-size:10px;white-space:nowrap}
  .pips{display:inline-flex;gap:2px} .pips i{width:5px;height:5px;border-radius:50%;display:inline-block}
  .mcPrim{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid var(--line);margin-bottom:3px}
  .mcPrim .pl{color:var(--dim)} .mcPrim b{font-variant-numeric:tabular-nums}
  .mcSec{display:flex;justify-content:space-between;gap:8px;line-height:1.5;font-variant-numeric:tabular-nums}
  .mcSec .sl{color:var(--dim)} .mcSec.spd{color:#7fd4ff;font-weight:600}
  .mcSec .rr{color:var(--dim);font-size:10px}
  .mpoolhdr{font-size:13px;font-weight:600;margin:14px 0 4px;display:flex;gap:8px;align-items:center}
  /* tabs */
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 16px}
  .tabs button{font:inherit;font-size:14px;padding:9px 16px;background:none;border:0;border-bottom:2px solid transparent;
    color:var(--dim);cursor:pointer;margin-bottom:-1px}
  .tabs button.on{color:var(--txt);border-bottom-color:var(--accent);font-weight:600}
  .pane{display:none} .pane.on{display:block}
  .pane section:first-child{margin-top:6px}
  /* journey tab (reuses cards/chips/track from above) */
  .jctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
  .jctrl input{margin:0;flex:1;min-width:150px;max-width:none}
  .jctrl .count{margin-left:auto;color:var(--dim);font-size:12px;white-space:nowrap}
  .jev{border:1px solid var(--line);border-radius:11px;background:var(--card);margin:0 0 10px;overflow:hidden}
  .jev.unlocked{opacity:.55}
  .jevh{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;flex-wrap:wrap}
  .jevh .rw{font-weight:700} .jevh .tt{color:var(--dim);font-size:12px}
  .jevh .ty{font-size:10.5px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:1px 8px}
  .jb{margin-left:auto;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;border:1px solid var(--line);white-space:nowrap}
  .jb.ok{color:#5bc46f;border-color:#2c5233;background:rgba(76,175,80,.1)}
  .jb.go{color:#e0b53d;border-color:#6b571d;background:rgba(224,181,61,.12)}
  .jb.work{color:#f3b05a;border-color:#6b4a1d;background:rgba(224,150,40,.12)}
  .jb.faction{color:var(--dim);border-style:dashed}
  .jev .track{border-radius:0;height:5px;border-left:0;border-right:0}
  .jbody{display:none;padding:0 14px 14px} .jev.open .jbody{display:block}
  .jtot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 8px}
  @media(max-width:640px){.jtot{grid-template-columns:1fr}}
  .jtot .box{border:1px solid var(--line);border-radius:9px;padding:10px 12px}
  .jtot h4{margin:0 0 8px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);
    font-weight:700;border:0;padding:0}
  .jshard{font-size:12px;color:#e0b53d;margin:2px 0 8px}
  .jev td.l,.jev th.l{text-align:left}
  .jrow.exp{cursor:pointer} .jrow.exp:hover td{background:rgba(127,140,160,.06)}
  .jcaret{display:inline-block;width:12px;color:var(--dim);font-size:9px}
  .jrow.open .jcaret{color:var(--accent)}
  .jdetail{display:none} .jdetail.show{display:table-row}
  .jdetail td{background:var(--bg);text-align:left;padding:8px 14px 12px 24px}
  .jmiss{color:var(--accent);font-size:10px;border:1px solid var(--accent);border-radius:5px;padding:0 5px;margin-left:5px}
  .jdsec{margin:8px 0} .jdlbl{display:block;font-size:10px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--dim);font-weight:700;margin-bottom:5px}
  .jnone{color:#5bc46f;font-size:12px}
  .mcWhy{color:#f3868f;font-size:10px;margin-top:5px;line-height:1.3}
  footer{margin-top:34px;color:#5c6674;font-size:12px}
  @media (prefers-color-scheme: light){
    :root{--bg:#eef1f5;--card:#fff;--line:#d3dae4;--txt:#18202c;--dim:#5a6576}
    .track{background:#e7ebf1}
  }
</style>
</head>
<body>
  <a class="homelink" href="index.html">← Cloudy Bay reports</a>
  <div id="out"><div class="msg">Loading…</div></div>
  <footer>Snapshots generated from live game data. Roster: stars / gear / relic per unit. Refreshed when the guild is swept.</footer>

<script>
const $ = s => document.querySelector(s);
const out = $("#out");
const fmt = n => (n ?? 0).toLocaleString();
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

async function getJSON(url){ const r = await fetch(url); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }

// ---- directory -----------------------------------------------------------
async function directory(){
  let idx;
  try { idx = await getJSON("players/index.json"); }
  catch { out.innerHTML = `<h1>Players Data</h1><div class="msg err">No player data published yet. Run <code>publish</code> to generate it.</div>`; return; }

  const rows = idx.members.map(m =>
    `<li data-name="${esc(m.name).toLowerCase()}"><a href="?ally=${m.code}">
       <span class="nm">${esc(m.name)}</span><span class="gp">${fmt(m.gp)} GP</span></a></li>`).join("");

  out.innerHTML = `
    <h1>${esc(idx.guild)} — Players</h1>
    <p class="sub">${idx.total} members · snapshot ${esc(idx.generatedAt)}. Click a member for their roster.</p>
    <input id="filter" placeholder="Filter by name…" autocomplete="off">
    <ul class="dir" id="dir">${rows}</ul>`;

  const f = $("#filter"), items = [...document.querySelectorAll("#dir li")];
  f.addEventListener("input", () => {
    const q = f.value.toLowerCase();
    for (const li of items) li.style.display = li.dataset.name.includes(q) ? "" : "none";
  });
  f.focus();
}

// ---- one player ----------------------------------------------------------
async function player(code){
  out.innerHTML = `<div class="msg">Loading ${esc(code)}…</div>`;
  let d;
  try { d = await getJSON(`players/${code}.json`); }
  catch { out.innerHTML = `<a class="back" href="player.html">← all players</a><div class="msg err">No snapshot for ${esc(code)}.</div>`; return; }

  const units = d.units || [];
  const chars = units.filter(u => u.c === 1);
  const ships = units.filter(u => u.c === 2);
  const seven  = chars.filter(u => u.r === 7).length;
  const g13    = chars.filter(u => u.g === 13).length;
  const relicd = chars.filter(u => u.rt > 0).length;

  const rel = Array(11).fill(0);
  for (const u of chars) if (u.rt > 0) rel[u.rt]++;
  const relMax = Math.max(1, ...rel);
  let relRows = "";
  for (let r=10;r>=1;r--) relRows += `<div class="lbl">R${r}</div><div class="track"><div class="fill relic" style="width:${rel[r]/relMax*100}%"></div></div><div class="cnt">${rel[r]}</div>`;

  const gear = Array(14).fill(0);
  for (const u of chars) gear[u.g] = (gear[u.g]||0)+1;
  const gMax = Math.max(1, ...gear.slice(1));
  let gRows = "";
  for (let g=13;g>=1;g--){ if(!gear[g] && g<7) continue; gRows += `<div class="lbl">G${g}</div><div class="track"><div class="fill" style="width:${gear[g]/gMax*100}%"></div></div><div class="cnt">${gear[g]}</div>`; }

  const shipStars = Array(8).fill(0);
  for (const u of ships) shipStars[u.r] = (shipStars[u.r]||0)+1;
  const ssMax = Math.max(1, ...shipStars.slice(1));
  let shipDist = "";
  for (let s=7;s>=1;s--){ if(!shipStars[s]) continue; shipDist += `<div class="lbl">${s}★</div><div class="track"><div class="fill" style="width:${shipStars[s]/ssMax*100}%"></div></div><div class="cnt">${shipStars[s]}</div>`; }
  const shipRows = [...ships].sort((a,b)=> b.r-a.r || a.n.localeCompare(b.n))
    .map(u=>`<tr><td>${esc(u.n)}</td><td class="num">${u.r}★</td></tr>`).join("");

  out.innerHTML = `
    <a class="back" href="player.html">← all players</a>
    <h1>${esc(d.name)}</h1>
    <p class="sub">Lvl ${d.level} · ${esc(d.guild||"—")} · ally ${d.code} · snapshot ${esc(d.updated)}</p>
    <div class="cards">
      <div class="card"><div class="k">Galactic Power</div><div class="v">${fmt(d.gp)}</div></div>
      <div class="card"><div class="k">Character GP</div><div class="v">${fmt(d.cgp)}</div></div>
      <div class="card"><div class="k">Ship GP</div><div class="v">${fmt(d.sgp)}</div></div>
    </div>

    <div class="tabs">
      <button data-pane="chars" class="on">Characters</button>
      <button data-pane="ships">Ships</button>
      <button data-pane="mods">Mods</button>
      <button data-pane="journey">Journey</button>
    </div>

    <div class="pane" id="pane-journey">
      <section id="jrn"><h2>Journey / GL readiness</h2><div class="sub">Loading…</div></section>
    </div>

    <div class="pane on" id="pane-chars">
      <section>
        <div class="cards">
          <div class="card"><div class="k">Characters</div><div class="v">${chars.length}</div></div>
          <div class="card"><div class="k">7★ Characters</div><div class="v">${seven}</div></div>
          <div class="card"><div class="k">Gear 13</div><div class="v">${g13}</div></div>
          <div class="card"><div class="k">Relic'd</div><div class="v">${relicd}</div></div>
        </div>
      </section>
      <section><h2>Relic levels</h2><div class="dist">${relRows}</div></section>
      <section><h2>Gear levels</h2><div class="dist">${gRows}</div></section>
      <section id="planner"><h2>Gear planner</h2><div class="sub">Loading gear data…</div></section>
    </div>

    <div class="pane" id="pane-ships">
      <section>
        <div class="cards">
          <div class="card"><div class="k">Ships</div><div class="v">${ships.length}</div></div>
          <div class="card"><div class="k">Ship GP</div><div class="v">${fmt(d.sgp)}</div></div>
          <div class="card"><div class="k">7★ Ships</div><div class="v">${shipStars[7]||0}</div></div>
        </div>
      </section>
      <section><h2>Ship rarity</h2><div class="dist">${shipDist||'<div class="sub">No ships.</div>'}</div></section>
      <section><h2>All ships</h2><div class="tblwrap"><table><thead><tr><th>Ship</th><th class="num">Stars</th></tr></thead><tbody>${shipRows}</tbody></table></div></section>
    </div>

    <div class="pane" id="pane-mods">
      <section id="mods"><h2>Mods</h2><div class="sub">Loading mods…</div></section>
    </div>`;

  let journeyLoaded = false;
  out.querySelectorAll(".tabs button").forEach(btn => btn.onclick = () => {
    out.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === btn));
    out.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.id === "pane-" + btn.dataset.pane));
    if (btn.dataset.pane === "journey" && !journeyLoaded) { journeyLoaded = true; renderJourney(d.code); }
  });

  renderPlanner(chars, d.code);
  renderMods(d.code);
}

// ---- gear planner (client-side, uses shared game-data assets) --------------
let ASSETS = null;
async function assets(){
  if (ASSETS) return ASSETS;
  const [gear, ename, relic, mname, salv] = await Promise.all(
    ["gear-recipes","equip-names","relic-recipes","mat-names","gear-salvage"].map(n => getJSON(`data/${n}.json`)));
  ASSETS = { gear, ename, relic, mname, salv };
  return ASSETS;
}
// gear pieces needed per tier [fromGear, toGear), skipping slots already equipped on fromGear
function gearByTier(baseId, fromGear, toGear, eq){
  const rec = ASSETS.gear[baseId]; const out = [];
  if (!rec) return out;
  const eqset = new Set(eq || []);
  for (let t = Math.max(1, fromGear); t < toGear; t++){
    const set = rec[String(t)]; if (!set) continue;
    const mats = {};
    for (let slot = 0; slot < set.length; slot++){
      if (t === fromGear && eqset.has(slot)) continue;
      mats[set[slot]] = (mats[set[slot]] || 0) + 1;
    }
    if (Object.keys(mats).length) out.push({ tier: t, mats });
  }
  return out;
}
function relicMats(fromR, toR){
  const acc = {};
  for (let t = fromR + 1; t <= toR; t++){
    const ing = ASSETS.relic[String(t)]; if (!ing) continue;
    for (const i of ing) acc[i.id] = (acc[i.id] || 0) + i.qty;
  }
  return acc;
}
// what a unit still needs to reach the chosen target
function needs(u, target){
  let gearTo = 0, relicTo = 0;
  if (target === "next"){ if (u.g < 13) gearTo = u.g + 1; else relicTo = Math.min(10, u.rt + 1); }
  else if (target[0] === "g") gearTo = +target.slice(1);
  else if (target[0] === "r") relicTo = +target.slice(1);
  let gearTiers = [], relic = {};
  if (relicTo > 0){
    if (u.g < 13) gearTiers = gearByTier(u.b, u.g, 13, u.eq);
    const fromR = u.g >= 13 ? u.rt : 0;
    if (relicTo > fromR) relic = relicMats(fromR, relicTo);
  } else if (gearTo > 0 && u.g < gearTo){
    gearTiers = gearByTier(u.b, u.g, gearTo, u.eq);
  }
  const gearCount = gearTiers.reduce((a,t)=>a + Object.values(t.mats).reduce((x,y)=>x+y,0), 0);
  const relicCount = Object.values(relic).reduce((a,b)=>a+b, 0);
  return { gearTiers, relic, gearCount, relicCount, done: gearCount===0 && relicCount===0 };
}
// ---- flatten / expand / aggregate helpers ----
const TARGETS = [["next","Next level"],["g11","Gear → 11"],["g12","Gear → 12"],["g13","Gear → 13"],
  ["r1","Relic → 1"],["r2","Relic → 2"],["r3","Relic → 3"],["r4","Relic → 4"],["r5","Relic → 5"],
  ["r6","Relic → 6"],["r7","Relic → 7"],["r8","Relic → 8"],["r9","Relic → 9"],["r10","Relic → 10"]];
// merge a needs() result's per-tier gear into a flat {equipId: qty}
function gearFlat(gearTiers){
  const out = {};
  for (const t of gearTiers) for (const [id,q] of Object.entries(t.mats)) out[id] = (out[id]||0) + q;
  return out;
}
// expand assembled gear pieces into raw farmable salvage via ASSETS.salv
function rawFlat(assembled){
  const out = {};
  for (const [id,q] of Object.entries(assembled)){
    const leaves = ASSETS.salv[id];
    if (leaves) for (const [lid,lq] of Object.entries(leaves)) out[lid] = (out[lid]||0) + lq*q;
    else out[id] = (out[id]||0) + q;   // no recipe: farmed directly
  }
  return out;
}
const addInto = (acc,o) => { for (const [k,v] of Object.entries(o)) acc[k]=(acc[k]||0)+v; return acc; };
const sumVals = o => Object.values(o).reduce((a,b)=>a+b,0);
const subOwned = (map,owned) => { const out={}; for (const [k,v] of Object.entries(map)){ const left=Math.max(0,v-(owned[k]||0)); if(left) out[k]=left; } return out; };
function chipRow(label, map, names, relic){
  if (!Object.keys(map).length) return "";
  const chips = Object.entries(map).sort((a,b)=>b[1]-a[1])
    .map(([id,q])=>`<span class="chip${relic?' relic':''}">${esc(names[id]||id)} ×${q}</span>`).join("");
  return `<div class="gtier"><span class="glbl">${label}</span><div class="chips">${chips}</div></div>`;
}

async function renderPlanner(chars, code){
  const host = document.getElementById("planner");
  try { await assets(); }
  catch { host.innerHTML = '<h2>Gear planner</h2><div class="msg err">Gear data not published yet — run <code>publish</code>.</div>'; return; }

  // optional private inventory for this ally (owned gear pieces + materials, merged)
  let inv = null;
  try { const raw = await getJSON(`players/${code}-inv.json`); inv = addInto(addInto({}, raw.equipment||{}), raw.material||{}); }
  catch { inv = null; }

  const topt = TARGETS.map(([v,l])=>`<option value="${v}">${l}</option>`).join("");
  host.innerHTML = `<h2>Gear planner</h2>
    <div class="sub" style="margin:-6px 0 12px">Tick the units you want to upgrade, pick a target for each, and the combined materials appear below.</div>
    <div class="pcontrols">
      <input id="gsearch" placeholder="search unit…" autocomplete="off">
      <div class="seg2" id="gmode"><button data-m="asm" class="on">Assembled</button><button data-m="raw">Raw salvage</button></div>
      ${inv ? `<label class="invtog"><input type="checkbox" id="ginv"> Subtract my inventory</label>` : ''}
    </div>
    <div id="gunits"></div>
    <div id="gtotal" class="ptotal"></div>`;

  const searchEl = document.getElementById("gsearch"), unitsEl = document.getElementById("gunits"),
        totalEl = document.getElementById("gtotal"), modeEl = document.getElementById("gmode"),
        invEl = document.getElementById("ginv");
  const plan = new Map();          // baseId -> target
  let mode = "asm";
  const byId = {}; for (const u of chars) byId[u.b] = u;

  // gear (in current mode) + relic mats a single planned unit still needs
  function unitNeed(u){
    const need = needs(u, plan.get(u.b));
    const asm = gearFlat(need.gearTiers);
    return { gear: mode==="raw" ? rawFlat(asm) : asm, relic: need.relic };
  }

  function drawTotal(){
    const chosen = [...plan.keys()];
    if (!chosen.length){ totalEl.innerHTML = ""; return; }
    let gearAsm = {}, relic = {};
    for (const b of chosen){ const need = needs(byId[b], plan.get(b)); addInto(gearAsm, gearFlat(need.gearTiers)); addInto(relic, need.relic); }
    let gear = mode==="raw" ? rawFlat(gearAsm) : gearAsm, rel = relic;
    if (invEl && invEl.checked){ gear = subOwned(gear, inv); rel = subOwned(rel, inv); }
    const gc = sumVals(gear), rc = sumVals(rel);
    const gearLbl = mode==="raw" ? "salvage" : "gear pieces";
    totalEl.innerHTML = `<div class="ttitle">Total — ${chosen.length} unit${chosen.length>1?'s':''}
        <span class="tsum">${fmt(gc)} ${gearLbl} · ${fmt(rc)} relic mats</span></div>
      ${gc||rc ? chipRow(mode==="raw"?"Salvage":"Gear", gear, ASSETS.ename) + chipRow("Relic mats", rel, ASSETS.mname, true)
               : '<div class="sub" style="padding:4px 0">Nothing needed — all targets met'+(invEl&&invEl.checked?' or covered by inventory.':'.')+'</div>'}`;
  }

  function drawUnits(){
    const q = searchEl.value.toLowerCase();
    const list = chars.filter(u => !q || u.n.toLowerCase().includes(q))
      .sort((a,b)=> (plan.has(b.b)?1:0)-(plan.has(a.b)?1:0) || a.n.localeCompare(b.n));
    unitsEl.innerHTML = list.map(u => {
      const on = plan.has(u.b);
      const cur = `${u.r}★ G${u.g}${u.rt?' R'+u.rt:''}`;
      let summ = "";
      if (on){ const t=unitNeed(u); const gc=sumVals(t.gear), rc=sumVals(t.relic);
        summ = gc+rc===0 ? '<span class="done">✓ met</span>'
          : [gc?`${gc} ${mode==="raw"?"salv":"gear"}`:null, rc?`${rc} relic`:null].filter(Boolean).join(' + '); }
      return `<div class="crow${on?' on':''}" data-b="${u.b}">
          <input type="checkbox" class="cb" ${on?'checked':''}>
          <span class="cn">${esc(u.n)}</span>
          <span class="cc">${cur}</span>
          ${on?`<select class="ctgt">${topt}</select>`:'<span></span>'}
          <span class="cneed">${summ}</span>
        </div>${on?'<div class="cdet"></div>':''}`;
    }).join("") || '<div class="sub">no units</div>';

    unitsEl.querySelectorAll(".crow").forEach(row => {
      const b = row.dataset.b;
      row.querySelector(".cb").onchange = e => {
        if (e.target.checked) plan.set(b, "next"); else plan.delete(b);
        drawUnits(); drawTotal();
      };
      const sel = row.querySelector(".ctgt");
      if (sel){ sel.value = plan.get(b); sel.onchange = () => { plan.set(b, sel.value); drawUnits(); drawTotal(); }; }
      const need = row.querySelector(".cneed");
      if (need && plan.has(b)) need.onclick = () => {
        const det = row.nextElementSibling;
        if (!det || !det.classList.contains("cdet")) return;
        if (det.innerHTML){ det.innerHTML = ""; return; }
        const t = unitNeed(byId[b]);
        det.innerHTML = (chipRow(mode==="raw"?"Salvage":"Gear", t.gear, ASSETS.ename) + chipRow("Relic mats", t.relic, ASSETS.mname, true))
          || '<div class="sub" style="padding:4px 0">Target already met.</div>';
      };
    });
  }

  modeEl.querySelectorAll("button").forEach(btn => btn.onclick = () => {
    mode = btn.dataset.m;
    modeEl.querySelectorAll("button").forEach(x => x.classList.toggle("on", x===btn));
    drawUnits(); drawTotal();
  });
  if (invEl) invEl.onchange = drawTotal;
  searchEl.oninput = drawUnits;
  drawUnits(); drawTotal();
}

// ---- mods (client-side, reads the C# ModReport payload) --------------------
const SLOT_SYM = {1:"■",2:"➤",3:"◆",4:"▲",5:"●",6:"✚"};
const SLOT_ORDER = [2,1,4,3,6,5];   // arrow, square, triangle, diamond, cross, circle
const MC_HEX  = {1:"#8a94a3",2:"#4caf50",3:"#3d7bd6",4:"#a259e6",5:"#e0b53d"};
const MC_NAME = {1:"Gray",2:"Green",3:"Blue",4:"Purple",5:"Gold"};

const fmtStat = (label, v) => label.includes("%") ? `${v}%` : `+${v}`;
const SPEED_FLOOR = {1:3,2:5,3:8,4:10,5:12};
const OFF_SETS = new Set([2,4,5,6]);   // Offense, Crit Chance, Crit Damage, Potency
// why a mod is a delete candidate (clash beats low-speed). Square/diamond/circle have fixed
// primaries so they never clash — they can only be flagged for low speed.
function delReason(m){
  if (m.cl) return OFF_SETS.has(m.set) ? "offense set · defensive primary" : "defense set · offensive primary";
  return `speed ${m.sp} < ${SPEED_FLOOR[m.c]} floor (${MC_NAME[m.c]})`;
}
function modTile(m){
  const b = m.b || "keep";
  const badge = b === "work" ? "⭐" : b === "del" ? "🔴" : b === "done" ? "🟢" : "";
  const pips = Array.from({length: m.d}, () => `<i style="background:${MC_HEX[m.c]}"></i>`).join("");
  // Worth calibrating for speed: 6-dot with a speed secondary not yet maxed on rolls (<5), still in
  // the cheap calibration range (>3 of the 6 remaining, i.e. fewer than 3 used — they get pricey after the 3rd).
  const calAvail = m.d === 6 && m.sp > 0 && m.sr < 5 && m.cal < 3;
  const secs = (m.ss || []).map(s => {
    const isSpd = s.k === "Speed";
    return `<div class="mcSec${isSpd?" spd":""}">
      <span class="sl">${esc(s.k)}${s.r?` <span class="rr">(${s.r})</span>`:""}</span>
      <span>${fmtStat(s.k, s.v)}</span></div>`;
  }).join("");
  const title = `${MC_NAME[m.c]} ${m.setN} ${m.slN} · lvl ${m.l}`
    + (m.cal ? ` · ${m.cal} calibration${m.cal!==1?"s":""} used` : "")
    + (calAvail ? ` · worth calibrating speed (${6-m.cal} cheap calibrations left)` : "")
    + (m.cl ? " · ⚠ set/primary clash" : "") + ` · potential ${m.pot}`;
  return `<div class="mcard mc${m.c}${m.cl?" clash":""}" title="${esc(title)}">
    <div class="mcHead"><span class="msym" style="color:${MC_HEX[m.c]}">${SLOT_SYM[m.sl]}</span>
      <span class="mcSet">${m.setN}</span><span class="mcBadge">${badge}</span></div>
    <div class="mcSub"><span class="pips">${pips}</span><span>Lvl ${m.l}${m.cal?` · cal ${m.cal}`:""}</span>
      ${calAvail?'<span class="calAv">⚙ calibrate</span>':""}</div>
    <div class="mcPrim"><span class="pl">${esc(m.pr)}</span><b>${fmtStat(m.pr, m.pv)}</b></div>
    <div class="mcSecs">${secs}</div>
    ${b==="del"?`<div class="mcWhy">🔴 ${esc(delReason(m))}</div>`:""}
  </div>`;
}

  function drawUnits(){
    const list = d.units.filter(u => !reqEl.checked || u.rt >= 1);
    unitsHost.innerHTML = list.map(u => {
      const c = u.counts;
      const cnt = [c.work?`<span class="mtag work">⭐${c.work}</span>`:"",
                   c.del?`<span class="mtag del">🔴${c.del}</span>`:"",
                   c.done?`<span class="mtag done">🟢${c.done}</span>`:""].join(" ");

      return `<div class="munit"><div class="mhead">
          <span class="mn">${esc(u.n)}</span>
          <span class="mmeta">${u.r}★ G${u.g}${u.rt?" R"+u.rt:""}</span>
          <span class="mcnt">${cnt}</span></div>
        <div class="mgrid">${mods}</div></div>`;
    }).join("") || '<div class="sub">No modded units at this filter.</div>';
  }

  function drawPool(){
    if (!hasUq || (eqEl && eqEl.checked)) { poolHost.innerHTML = ""; return; }
    const groups = [["work","⭐ Work on"],["del","🔴 Delete candidates"],["done","🟢 Done"],["keep","Keep / other"]];
    poolHost.innerHTML = `<h2 style="margin-top:22px">Unequipped pool</h2>` + groups.map(([k,label]) => {
      const items = d.unequipped.filter(m => (m.b||"keep") === k);
      if (!items.length) return "";
      return `<div class="mpoolhdr">${label} <span class="sub" style="font-weight:400">(${items.length})</span></div>
        <div class="mpool">${items.map(modTile).join("")}</div>`;
    }).join("");
  }

  reqEl.onchange = drawUnits;
  if (eqEl) eqEl.onchange = drawPool;
  drawUnits(); drawPool();
}

// ---- journey / GL readiness tab (renders the JourneyReport payload in the site style) ------
async function renderJourney(code){
  const host = document.getElementById("jrn");
  let D;
  try { D = await getJSON(`players/${code}-journey.json`); }
  catch { host.innerHTML = '<h2>Journey / GL readiness</h2><div class="sub">Journey data appears after the next full sweep.</div>'; return; }

  const E = D.events;
  const lockedSpecific = E.filter(e => !e.unlocked && e.hasSpecific);
  const unlockedList   = E.filter(e => e.unlocked);
  const factionOnly    = E.filter(e => !e.unlocked && !e.hasSpecific);
  const ready          = lockedSpecific.filter(e => e.needCount === 0);
  let filter = "locked", q = "", gm = false;   // gm = raw salvage

  host.innerHTML = `<h2>Journey / GL readiness</h2>
    <div class="cards">
      <div class="card"><div class="k">Unlocked</div><div class="v">${unlockedList.length}</div></div>
      <div class="card"><div class="k">Ready to enter</div><div class="v">${ready.length}</div></div>
      <div class="card"><div class="k">In progress</div><div class="v">${lockedSpecific.length-ready.length}</div></div>
      <div class="card"><div class="k">Faction-gated</div><div class="v">${factionOnly.length}</div></div>
    </div>
    <div class="jctrl">
      <div class="seg2" id="jfilter"><button data-f="locked" class="on">To unlock</button><button data-f="all">All</button><button data-f="unlocked">Unlocked</button></div>
      <div class="seg2" id="jgear"><button data-g="asm" class="on">Assembled</button><button data-g="raw">Raw salvage</button></div>
      <input id="jq" placeholder="filter event or unit…" autocomplete="off">
      <span class="count" id="jcount"></span>
    </div>
    <div id="jlist"></div>
    <p class="sub" style="margin-top:16px">Requirements from swgoh.wiki + game data. Every unit is also required at 7★ — shard counts are an upper bound ("banked shards aren't exposed by the API). Relic requirements include gear to G13 first.</p>`;

  const listEl = host.querySelector("#jlist"), countEl = host.querySelector("#jcount"), qEl = host.querySelector("#jq");
  const chipsOf = (list, cls) => (list||[]).map(x => `<span class="chip${cls==="relic"?" relic":""}">${esc(x.name)} ×${fmt(x.qty)}</span>`).join("");
  const matChips = (list, cls) => list && list.length ? chipsOf(list, cls) : '<span class="jnone">— none —</span>';

  function unitRow(u){
    const cur = u.owned ? `${u.curStars}★ G${u.curGear}${u.curRelic>0?" R"+u.curRelic:""}` : "unowned";
    const req = u.kind==="relic"?`7★ R${u.need}`:u.kind==="gear"?`7★ G${u.need}`:"7★";
    const gList = gm ? u.salvage : u.gear, gCount = gm ? u.salvageCount : u.gearCount;
    const parts = [];
    if (u.relicCount) parts.push(u.relicCount+" relic");
    if (gCount) parts.push(gCount+(gm?" salvage":" gear"));
    if (u.shards) parts.push("≤"+u.shards+" shards");
    const exp = !u.done && (u.relicCount || gCount || u.shards);
    const status = u.done ? '<span style="color:#5bc46f">✓</span>' : (parts.length ? parts.join(" + ") : "—");
    const caret = `<span class="jcaret">${exp?"▸":""}</span>`;
    const main = `<tr class="jrow${u.done?" done":""}${exp?" exp":""}"${exp?` onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('show')"`:""}>
      <td class="l">${caret}${esc(u.name)}${u.owned?"":'<span class="jmiss">unowned</span>'}</td>
      <td class="num">${cur}</td><td class="num">→</td><td class="num">${req}</td><td class="num">${status}</td></tr>`;
    if (!exp) return main;
    const sec = [];
    if (gCount) sec.push(`<div class="jdsec"><span class="jdlbl">${gm?"Raw salvage to farm":"Gear to assemble"} (${fmt(gCount)})</span><div class="chips">${chipsOf(gList)}</div></div>`);
    if (u.relicCount) sec.push(`<div class="jdsec"><span class="jdlbl">Relic materials (${fmt(u.relicCount)})</span><div class="chips">${chipsOf(u.relic,"relic")}</div></div>`);
    if (u.shards) sec.push(`<div class="jdsec"><span class="jdlbl">Shards</span><span class="jshard">up to ${fmt(u.shards)} to reach 7★</span></div>`);
    return main + `<tr class="jdetail"><td colspan="5">${sec.join("")}</td></tr>`;
  }

  function eventCard(e){
    const pct = e.totalUnits ? Math.round((e.totalUnits-e.needCount)/e.totalUnits*100) : 100;
    let badge;
    if (e.unlocked) badge = '<span class="jb ok">✓ Unlocked</span>';
    else if (!e.hasSpecific) badge = '<span class="jb faction">faction / own-unit</span>';
    else if (e.needCount===0) badge = '<span class="jb go">★ Ready</span>';
    else badge = `<span class="jb work">${e.needCount} to go</span>`;
    const head = `<div class="jevh" onclick="this.parentNode.classList.toggle('open')">
      <span class="rw">${esc(e.reward||e.title)}</span><span class="tt">${esc(e.title)}</span>
      <span class="ty">${esc(e.type)}</span>${badge}</div>`;
    if (e.unlocked) return `<div class="jev unlocked">${head}</div>`;
    if (!e.hasSpecific) return `<div class="jev">${head}<div style="padding:0 14px 12px"><span class="sub">Requires: ${esc(e.requires||"—")}</span></div></div>`;
    const gTot = gm ? e.salvageTotals : e.gearTotals, gGr = gm ? e.salvageGrand : e.gearGrand;
    const body = `<div class="track"><div class="fill" style="width:${pct}%"></div></div>
      <div class="jbody">
        <div class="jtot">
          <div class="box"><h4>Relic materials (${fmt(e.relicGrand)})</h4><div class="chips">${matChips(e.relicTotals,"relic")}</div></div>
          <div class="box"><h4>${gm?"Raw salvage":"Gear pieces"} (${fmt(gGr)})</h4><div class="chips">${matChips(gTot.slice(0,18))}</div></div>
        </div>
        ${e.shardGrand?`<div class="jshard">★ up to ${fmt(e.shardGrand)} shards to 7★ across units</div>`:""}
        <div class="tblwrap"><table><thead><tr><th class="l">Unit</th><th class="num">Current</th><th></th><th class="num">Req</th><th class="num">Needs</th></tr></thead>
          <tbody>${e.units.map(unitRow).join("")}</tbody></table></div>
      </div>`;
    return `<div class="jev">${head}${body}</div>`;
  }

  function draw(){
    let list = filter==="locked" ? lockedSpecific.concat(factionOnly) : filter==="unlocked" ? unlockedList : E.slice();
    list = list.slice().sort((a,b)=>{
      const ra=a.unlocked?3:(!a.hasSpecific?2:0), rb=b.unlocked?3:(!b.hasSpecific?2:0);
      return ra!==rb ? ra-rb : (a.needCount??99)-(b.needCount??99);
    });
    if (q) list = list.filter(e => (e.reward||"").toLowerCase().includes(q) || e.title.toLowerCase().includes(q) || (e.units||[]).some(u=>u.name.toLowerCase().includes(q)));
    listEl.innerHTML = list.map(eventCard).join("") || '<div class="sub">no events</div>';
    countEl.textContent = list.length + " events";
  }
  host.querySelectorAll("#jfilter button").forEach(b => b.onclick = () => { filter=b.dataset.f; host.querySelectorAll("#jfilter button").forEach(x=>x.classList.toggle("on",x===b)); draw(); });
  host.querySelectorAll("#jgear button").forEach(b => b.onclick = () => { gm=b.dataset.g==="raw"; host.querySelectorAll("#jgear button").forEach(x=>x.classList.toggle("on",x===b)); draw(); });
  qEl.oninput = () => { q=qEl.value.toLowerCase(); draw(); };
  draw();
}

const code = new URLSearchParams(location.search).get("ally");
(code ? player(code) : directory()).catch(e => out.innerHTML = `<div class="msg err">${esc(e.message)}</div>`);
